name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      # Gate policy: thresholds sit 1 point under what CI measures. Raise them only in a dedicated
      # ci: commit after a test-adding PR, never loosen them inside a feature PR.
      - name: Unit tests + coverage gate
        run: npm run test:coverage
      - name: E2E against a booted instance (agent role, loopback only)
        run: |
          MACHINE_ROLE=agent API_BIND=127.0.0.1 LOCAL_APPS_DB=/tmp/ci-local.db node server.js > /tmp/ci-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:9875/api/status > /dev/null && break; sleep 1; done
          E2E_MUTATE=1 npm run test:e2e || { echo '--- server log ---'; cat /tmp/ci-server.log; exit 1; }
          kill %1
      - name: Audit (fail on high/critical)
        run: npm audit

  # The darwin provisioning branch (a real Caddyfile write + caddy validate/reload, a LaunchAgent plist
  # + launchctl) only runs on macOS; this job boots a scratch instance there and runs the same lifecycle.
  provision-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Caddy
        run: brew install caddy
      - name: E2E lifecycle on the darwin branch (scratch Caddyfile and LaunchAgents dir, a live caddy)
        run: |
          export CADDYFILE=$RUNNER_TEMP/Caddyfile; : > "$CADDYFILE"
          export LAUNCH_AGENTS_DIR=$RUNNER_TEMP/LaunchAgents; mkdir -p "$LAUNCH_AGENTS_DIR"
          # A real caddy (root, so the http://<id>.localhost block can bind :80); the server's
          # `caddy reload` talks to its admin endpoint, and the lifecycle asserts the block proxies.
          sudo caddy run --config "$CADDYFILE" --adapter caddyfile > $RUNNER_TEMP/caddy.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:2019/config/ > /dev/null && break; sleep 1; done
          export CADDY_LIVE=1
          MACHINE_ROLE=agent API_BIND=127.0.0.1 LOCAL_APPS_DB=$RUNNER_TEMP/ci-local.db node server.js > $RUNNER_TEMP/server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:9875/api/status > /dev/null && break; sleep 1; done
          CADDYFILE=$CADDYFILE LAUNCH_AGENTS_DIR=$LAUNCH_AGENTS_DIR E2E_MUTATE=1 npm run test:e2e || { echo '--- server log ---'; cat $RUNNER_TEMP/server.log; exit 1; }
          kill %2; sudo pkill -x caddy || true
          test -z "$(tr -d '[:space:]' < "$CADDYFILE")" || { echo 'lifecycle left a Caddy block behind:'; cat "$CADDYFILE"; exit 1; }
          ls "$LAUNCH_AGENTS_DIR" | grep -q zzz-e2e && { echo 'lifecycle left a LaunchAgent behind'; exit 1; } || true
