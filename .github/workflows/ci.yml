name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Audit (warn only)
        run: npm audit --audit-level=high || true
# Note: the e2e suite (tests/e2e) requires a running instance on :9876,
# so it is a local step (npm run dev, then npm run test:e2e), not part of CI.
