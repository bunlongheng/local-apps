name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests + coverage gate
        run: npm run test:coverage
      - name: E2E against a booted instance (agent role, loopback only)
        run: |
          MACHINE_ROLE=agent API_BIND=127.0.0.1 LOCAL_APPS_DB=/tmp/ci-local.db node server.js > /tmp/ci-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:9875/api/status > /dev/null && break; sleep 1; done
          npm run test:e2e || { echo '--- server log ---'; cat /tmp/ci-server.log; exit 1; }
          kill %1
      - name: Audit (fail on high/critical)
        run: npm audit
